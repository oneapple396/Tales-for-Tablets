<!doctype html><meta charset="utf-8"><title>Badge responsive checks</title><pre id="result">Running</pre><script src="../scripts/story.js"></script><script>
(async()=>{const rows=[];for(const width of [320,390,768,1280]){const f=document.createElement('iframe');f.width=width;f.height=740;const ready=new Promise(r=>f.onload=r);f.src='../reader.html';document.body.append(f);await ready;const w=f.contentWindow,d=f.contentDocument,v=new w.BookView(d.querySelector('#book'),STORY);v.activities=new w.BookActivities({unlock(){},playEffect(){}});v.render(1);d.querySelector('.badge-story-action').click();const dialog=d.querySelector('dialog'),r=dialog.getBoundingClientRect();rows.push((r.left>=0&&r.right<=width&&r.top>=0&&r.bottom<=740&&dialog.scrollWidth<=dialog.clientWidth?'PASS':'FAIL')+' '+width+'px editor fits; controls reachable by dialog scrolling');dialog.close();v.activities.cancel();f.remove();}document.querySelector('#result').textContent=rows.join('\n');})();
</script>
