<!doctype html><title>Wide screen checks</title><pre id="result">Running</pre><script>
(async()=>{let rows=[];for(const [w,h] of [[900,600],[1280,720],[1440,900],[1920,1080]])for(const url of ['index.html','reader.html']){const f=document.createElement('iframe');f.width=w;f.height=h;f.src='../'+url;document.body.append(f);await new Promise(r=>f.onload=r);const d=f.contentDocument;const fit=d.documentElement.scrollHeight<=h&&d.documentElement.scrollWidth<=w;rows.push((fit?'PASS':'FAIL')+' '+url+' '+w+'×'+h+' document fit '+d.documentElement.scrollHeight);if(url==='reader.html')rows.push((d.querySelectorAll('#book > .page').length===2?'PASS':'FAIL')+' two facing pages');else{const r=d.querySelector('.hearth').getBoundingClientRect();rows.push((r.width/r.height<1.8?'PASS':'FAIL')+' firebox proportions '+(r.width/r.height).toFixed(2));}f.remove();}document.querySelector('#result').textContent=rows.join('\n');})();
</script>
