<!doctype html><html lang="en"><meta charset="utf-8"><base href="../"><title>Scene review</title><link rel="stylesheet" href="styles/book.css"><link rel="stylesheet" href="styles/activities.css"><link rel="stylesheet" href="styles/polish.css"><link rel="stylesheet" href="styles/mission-badge.css"><style>body{padding:8px}label{display:block;text-align:center;margin-bottom:10px}.stage{margin:0 auto}.book{height:650px;min-height:650px}.stage{max-width:870px}select{font:inherit}</style><label>Review spread <select id="spread"></select></label><main class="stage"><div class="book" id="book"></div></main><script src="scripts/story.js"></script><script src="scripts/book-view.js"></script><script src="scripts/activity-state.js"></script><script src="scripts/book-activities.js"></script><script src="scripts/mission-badge.js"></script><script>const select=document.querySelector('select'),book=document.querySelector('#book'),v=new BookView(book,STORY);v.activities=new BookActivities({unlock(){},playEffect(){}});for(let i=0;i<8;i++){const o=document.createElement('option');o.value=i;o.textContent=(i*2+1)+'–'+(i*2+2);select.append(o)}select.onchange=()=>{v.activities.cancel();v.render(Number(select.value))};v.render(0);</script></html>
