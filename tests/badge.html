<!doctype html><meta charset="utf-8"><title>Mission badge checks</title><pre id="results">Running</pre><iframe title="Test reader" src="../reader.html" width="1100" height="800"></iframe><script src="../scripts/story.js"></script><script>
(async()=>{const f=document.querySelector('iframe');await new Promise(r=>f.onload=r);const w=f.contentWindow,d=f.contentDocument,out=document.querySelector('#results'),results=[];const old=w.localStorage.getItem('johnny-mission-badge');const audio={unlock(){},playEffect(){},stop(){}};const activities=new w.BookActivities(audio),view=new w.BookView(d.querySelector('#book'),STORY);view.activities=activities;activities.state.clearBadge();const show=i=>{activities.cancel();view.render(i/2);return d.querySelector('#book');};const assert=(v,m)=>{if(!v)throw Error(m);};const test=(name,fn)=>{try{fn();results.push('PASS '+name);}catch(e){results.push('FAIL '+name+': '+e.message);}out.textContent=results.join('\n');};
test('every page has an actionable control',()=>{for(let i=0;i<8;i++){show(i*2);for(const p of d.querySelectorAll('#book > .page'))assert(p.querySelector('[data-interactive]:not([disabled])'),'page '+p.dataset.storyPage);}});
test('cover responds visibly',()=>{show(0);d.querySelector('.cover-star-button').click();assert(d.querySelector('.stars-awake'),'stars not lit');});
test('editor rejects empty badge and saves custom art and name',()=>{show(2);d.querySelector('.badge-story-action').click();const dialog=d.querySelector('dialog');dialog.querySelector('.badge-save').click();assert(dialog.open,'empty badge saved');[...dialog.querySelectorAll('button')].find(b=>b.textContent==='Add a star').click();const c=dialog.querySelector('.badge-canvas'),r=c.getBoundingClientRect();for(const [type,x,y] of [['pointerdown',.3,.3],['pointermove',.6,.7],['pointerup',.6,.7]])c.dispatchEvent(new w.PointerEvent(type,{pointerId:1,isPrimary:true,button:0,clientX:r.left+r.width*x,clientY:r.top+r.height*y,bubbles:true}));assert(c.querySelectorAll('path').length===2,'freehand stroke missing');dialog.querySelector('input').value='Moon mice';dialog.querySelector('.badge-save').click();assert(!d.querySelector('dialog'),'editor stayed open');assert(activities.state.badge.name==='Moon mice','name not stored');});
let drawing;
test('same drawing attaches to rocket and returns later',()=>{show(6);d.querySelector('.badge-story-action').click();drawing=d.querySelector('.mission-badge path').getAttribute('d');for(const i of [10,12,14]){show(i);const badges=d.querySelectorAll('.mission-badge');assert(badges.length,'missing badge on spread '+i);for(const b of badges)assert(b.querySelector('path').getAttribute('d')===drawing,'drawing changed');}});
test('Mars flag responds and keeps the drawing',()=>{show(14);d.querySelector('.mission-flag button').click();assert(d.querySelector('.mission-flag.planted'),'flag not planted');assert(d.querySelector('.mission-flag path').getAttribute('d')===drawing,'flag differs');});
test('saved badge survives new state and reset removes it',()=>{const state=new w.ActivityState();assert(state.badge.name==='Moon mice','not persisted');state.clearBadge();assert(new w.ActivityState().badge===null,'reset failed');});
activities.cancel();if(old===null)w.localStorage.removeItem('johnny-mission-badge');else w.localStorage.setItem('johnny-mission-badge',old);out.textContent+='\n'+results.filter(s=>s.startsWith('PASS')).length+'/'+results.length+' passed';})();
</script>
