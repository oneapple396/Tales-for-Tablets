<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive visual preview</title><style>body{background:#e8dfcd;color:#263d3d;font:16px system-ui;margin:20px}iframe{display:block;margin-top:20px;border:1px solid #8c805e}select{font:inherit;padding:8px}</style><label>Screen size <select id="size"><option value="390,844">Phone — 390 × 844</option><option value="768,1024">Portrait tablet — 768 × 1024</option><option value="1024,768">Landscape tablet — 1024 × 768</option></select></label><iframe title="Responsive storybook preview" src="../reader.html" width="390" height="844"></iframe><script>document.querySelector('select').onchange=e=>{const [w,h]=e.target.value.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;};</script></html>
